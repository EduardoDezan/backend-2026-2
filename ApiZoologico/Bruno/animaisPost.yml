info:
  name: animaisPost
  type: http

http:
  method: POST
  url: http://localhost:5207/api/animais
  body:
    type: json
    data: |-
      {
        "nome" : "Mula",
        "saudavel" : true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
